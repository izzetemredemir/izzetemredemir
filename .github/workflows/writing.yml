name: Writing

# Keeps the Writing list in README.md in sync with izzetemredemir.com/rss.xml.
# GitHub pauses scheduled workflows after 60 days without a commit, so after
# publishing a post run: gh workflow run writing.yml -R izzetemredemir/izzetemredemir

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: python3 .github/scripts/writing.py

      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Refresh the Writing list'
          git push
