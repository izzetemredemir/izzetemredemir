<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-labelledby="t d">
  <title id="t">İzzet Emre Demir</title>
  <desc id="d">Building First Point: mobile apps, AI agents and blockchain.</desc>

  <defs>
    <radialGradient id="glow" cx="0.07" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#f0a429" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f0a429" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a429" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#6b5730" stop-opacity="1"/>
      <stop offset="100%" stop-color="#43434e" stop-opacity="1"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="271" rx="16" fill="#0a0a0b" stroke="#2a2a30"/>
  <rect x="0.5" y="0.5" width="959" height="271" rx="16" fill="url(#glow)"/>

  <!-- timeline rail, the motif from izzetemredemir.com -->
  <line x1="88" y1="86" x2="88" y2="208" stroke="url(#rail)" stroke-width="2"/>
  <circle cx="88" cy="86" r="11" fill="#f0a429" fill-opacity="0.14"/>
  <circle cx="88" cy="86" r="5.5" fill="#f0a429"/>
  <circle cx="88" cy="148" r="4.5" fill="#0a0a0b" stroke="#3a3a42" stroke-width="1.5"/>
  <circle cx="88" cy="208" r="4.5" fill="#0a0a0b" stroke="#3a3a42" stroke-width="1.5"/>

  <text class="sans" x="128" y="104" fill="#f4f4f5" font-size="52" font-weight="700" letter-spacing="-1.6">İzzet Emre Demir</text>

  <text class="sans" x="128" y="156" fill="#8b8b93" font-size="23" letter-spacing="-0.2">Building <tspan fill="#f0a429">First Point</tspan>: mobile apps, AI agents and blockchain.</text>

  <text class="mono" x="128" y="214" font-size="16" letter-spacing="0.2">
    <tspan fill="#f0a429">izzetemredemir.com</tspan><tspan fill="#5f5f67">   ·   Mobile   ·   AI agents   ·   Zero-knowledge</tspan>
